# Render Blueprint — deploy both services in one shot via
# Render dashboard > New > Blueprint > connect this repo.
#
# The backend keeps party state in memory and the Hall of Fame in a local
# JSON file — the free web service plan wipes local disk and restarts the
# process after ~15 minutes with no traffic. As long as at least one player
# stays connected (host, projection screen, a player phone) the websocket
# keeps it alive; the risk is only before the first person connects, or if
# everyone disconnects for 15+ minutes between rounds. See the paid
# "starter" plan (no spin-down) if that's not an acceptable risk for a live
# event — swap `plan: free` below to `plan: starter`.
services:
  - type: web
    name: cerebrose-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        value: https://cerebrose-frontend.onrender.com

  - type: web
    name: cerebrose-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_SOCKET_URL
        value: https://cerebrose-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
